<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#204f3c">
    <title>صفحه پیدا نشد | سلیاک‌فود</title>
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
    <style>
      @font-face {
        font-family: Vazirmatn;
        src: url('/assets/fonts/vazirmatn-variable.woff2') format('woff2');
        font-weight: 100 900;
        font-style: normal;
        font-display: swap;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem 1.25rem;
        color: #233d33;
        background: #f4f2ea;
        font-family: Vazirmatn, Tahoma, sans-serif;
        line-height: 1.9;
      }
      main { width: min(100%, 36rem); }
      .wordmark { font-size: 1.1rem; font-weight: 700; }
      .code { margin: 2rem 0 0; font-size: 4rem; font-weight: 700; line-height: 1.3; }
      h1 { margin: .5rem 0 1rem; font-size: clamp(1.65rem, 5vw, 2.5rem); line-height: 1.5; }
      p { margin: 0 0 1.5rem; }
      a {
        display: inline-flex;
        align-items: center;
        min-height: 3rem;
        padding: .65rem 1.25rem;
        border: 2px solid #204f3c;
        border-radius: .35rem;
        background: #204f3c;
        color: #fff;
        text-decoration: none;
        font-weight: 600;
      }
      a:hover { background: #163d2d; }
      a:focus-visible { outline: 3px solid #1b6693; outline-offset: 4px; }
      @media (forced-colors: active) { a { border-color: LinkText; } }
    </style>
  </head>
  <body>
    <main>
      <p class="wordmark">سلیاک‌فود</p>
      <p class="code" aria-hidden="true">۴۰۴</p>
      <h1>این صفحه پیدا نشد</h1>
      <p>ممکن است نشانی تغییر کرده باشد یا پیوند درست نباشد. از صفحه اصلی می‌توانید با ما و راه‌های ارتباطی آشنا شوید.</p>
      <a href="/">بازگشت به صفحه اصلی</a>
    </main>
  </body>
</html>
